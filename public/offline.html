<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>اتصال اینترنت قطع است | سازه‌شاپ</title>
    <meta name="theme-color" content="#0f766e">
    <link rel="stylesheet" href="assets/css/app.css">
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
    <style>
        .offline-wrap { min-height: 78vh; display: grid; place-items: center; padding: 24px; }
        .offline-card {
            max-width: 460px; text-align: center; background: #fff; border: 1px solid var(--line);
            border-radius: var(--radius-lg); padding: 34px 26px;
        }
        .offline-card .mark {
            width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 20px;
            background: var(--brand-soft); color: var(--brand-ink); display: grid; place-items: center;
        }
        .offline-card .mark svg { width: 32px; height: 32px; }
    </style>
</head>
<body>
<div class="offline-wrap">
    <div class="offline-card">
        <div class="mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                <path d="M3 3l18 18M8.5 15.5a5 5 0 0 1 7 0M5.5 12a11 11 0 0 1 3.3-2M18.5 12a11 11 0 0 0-2.2-1.4M11.4 19.5a1 1 0 0 1 1.2 0"/>
            </svg>
        </div>
        <h1 style="font-size:1.3rem;">اتصال اینترنت شما قطع است</h1>
        <p class="muted small">صفحه‌هایی که قبلاً دیده‌اید از حافظه دستگاه نمایش داده می‌شوند. برای ثبت سفارش جدید به اینترنت نیاز دارید.</p>
        <div class="row" style="justify-content:center; margin-top:16px;">
            <a class="btn btn-primary" href="./">تلاش مجدد</a>
            <a class="btn btn-ghost" href="./cart">سبد خرید</a>
        </div>
    </div>
</div>
</body>
</html>
